# Se le da un nombre el fujo de trabajo
name: Docker
# On configura cuando se ejecuta el fujo
# se programa para que se ejecute de madrugada y cuando se hacen push y pull a la rama master
on:
    push:
        branches: ["master"]
        tags: ["v*.*.*"]
    pull_request:
        branches: ["master"]
#variables
env:
    REGISTRY: docker.io
    IMAGE_NAME: xavimagine/proyecto-aws
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test # Aquí se ejecutan tus tests
    #este build crea un repositorio con la imagen  dandole el nombre que se puseo en env
    build:
        #Solo se ejecuta si testsale bien
        needs: test
        # Github usara un ordenador ubunto para hacer el build y hay que darle los permisos
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
        # son los paso que debe realizar cada jobs que se ejecuta
        steps:
            #copia el codigo del repositorio al servidor de gitub
            - name: Checkout repository
              uses: actions/checkout@v4
            #instala una dependencia para poder crear la imagen
            - name: Install cosign
              if: github.event_name != 'pull_request'
              uses: sigstore/cosign-installer@v3.5.0
            #levanta el constructuro de la imagen
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3.0.0
            #Busca los secretos guardados en github  para identificar el docker hub donde subirla
            - name: Log into registry ${{ env.REGISTRY }}
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
            #Genera etiquetas automaticas
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
            #Construye la imagen usando dockerfile y la sube al repositorio
            - name: Build and push Docker image
              id: build-and-push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            #Termina de generar la imagen y garantiza que no lleve codigo malicioso
            - name: Sign the published Docker image
              if: github.event_name != 'pull_request'
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
                  DIGEST: ${{ steps.build-and-push.outputs.digest }}
              run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
    deploy:
        needs: build
        if: github.event_name != 'pull_request' # No desplegamos en pruebas de pull request
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to AWS via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.AWS_HOST }} # IP de tu EC2
                  username: ubuntu # Usuario (ubuntu por defecto)
                  key: ${{ secrets.AWS_SSH_KEY }} # Tu archivo .pem
                  script: |
                      # 1. Ir a la carpeta donde reside el docker-compose.yml en tu servidor AWS
                        cd ~/gescon_jdr || exit

                        # 2. Login en Docker
                        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

                        # 3. Limpiar cualquier rastro de contenedores manuales antiguos para liberar el puerto
                        docker stop mi-contenedor-aws || true
                        docker rm mi-contenedor-aws || true

                        # 4. Usar Docker Compose para gestionar todo el stack (App + DB)
                        # Esto asegura que se use la red 'concesionario_net' definida en el compose
                        docker-compose pull
                        docker-compose up -d --force-recreate

                        # 5. Limpieza de imágenes huérfanas
                        docker image prune -f
