name: CI - App with MySQL (direct)

on:
    workflow_dispatch:
    pull_request:
        branches: ["master"]

jobs:
    app-with-db:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root1234
                    MYSQL_DATABASE: concesionario_jdr
                    MYSQL_USER: concesionario
                    MYSQL_PASSWORD: concesionario1234
                ports:
                    - 3306/tcp
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot1234"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=30
        steps:
            - uses: actions/checkout@v4

            - name: Detect project location
              shell: bash
              run: |
                  if [ -f "escon/package.json" ]; then
                    echo "APP_DIR=escon" >> "$GITHUB_ENV"
                  else
                    echo "APP_DIR=." >> "$GITHUB_ENV"
                  fi

                  if [ -f "escon/src/jdr/sql/init.sql" ]; then
                    echo "INIT_SQL=escon/src/jdr/sql/init.sql" >> "$GITHUB_ENV"
                  else
                    echo "INIT_SQL=src/jdr/sql/init.sql" >> "$GITHUB_ENV"
                  fi

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              shell: bash
              run: |
                  cd "${APP_DIR}"
                  npm ci

            - name: Install mysql client
              run: |
                  sudo apt-get update
                  sudo apt-get install -y mysql-client

            - name: Wait for MySQL healthcheck
              run: |
                  for i in {1..60}; do
                    mysqladmin ping -h 127.0.0.1 -P "${{ job.services.mysql.ports[3306] }}" -uroot -proot1234 --silent && exit 0
                    sleep 2
                  done
                  echo "MySQL did not become ready in time" >&2
                  exit 1

            - name: Apply schema/data (init.sql)
              run: |
                  mysql -h 127.0.0.1 -P "${{ job.services.mysql.ports[3306] }}" -uroot -proot1234 < "${INIT_SQL}"

            - name: Start API (connected to MySQL service)
              env:
                  DB_HOST: 127.0.0.1
                  DB_PORT: ${{ job.services.mysql.ports[3306] }}
                  DB_USER: concesionario
                  DB_PASSWORD: concesionario1234
                  DB_NAME: concesionario_jdr
                  PORT: 3000
              shell: bash
              run: |
                  cd "${APP_DIR}"
                  node src/jdr/index.js > server.log 2>&1 &
                  echo $! > server.pid

                  for i in {1..60}; do
                    curl -fsS "http://127.0.0.1:3000/" >/dev/null && break
                    sleep 1
                  done

                  curl -fsS "http://127.0.0.1:3000/" | head -c 400

            - name: Smoke test endpoint that queries DB
              run: |
                  curl -fsS "http://127.0.0.1:3000/api/coches?marca=Seat" | head -c 800

            - name: Stop API
              if: always()
              shell: bash
              run: |
                  if [ -f "${APP_DIR}/server.pid" ]; then
                    kill "$(cat "${APP_DIR}/server.pid")" || true
                  fi
